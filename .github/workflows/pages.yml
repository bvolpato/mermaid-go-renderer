name: pages

# Builds the website and publishes it on GitHub Pages:
# https://bvolpato.github.io/mermaid-go-renderer/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A new run replaces a run that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      # The generator renders the gallery and the three corpora, and builds
      # the renderer as a WebAssembly module for the playground.
      - name: Build the website
        run: go run ./tools/sitegen -out dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
