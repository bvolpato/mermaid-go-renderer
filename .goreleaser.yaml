version: 2

project_name: mermaid-go-renderer

before:
  hooks:
    - go mod tidy

builds:
  - id: mmdg
    main: ./cmd/mmdg
    binary: mmdg
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # The files that go into each archive with the binary. The binary has
    # code of other projects, and THIRD_PARTY_NOTICES.md has their notices
    # and their license texts. The repository has no license file yet. The
    # pattern LICENSE* adds that file when the owner adds it.
    files:
      - "LICENSE*"
      - "README*"
      - "CHANGELOG*"
      - "THIRD_PARTY_NOTICES.md"

checksum:
  name_template: checksums.txt

changelog:
  use: git

brews:
  - repository:
      owner: bvolpato
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    name: mmdg
    commit_author:
      name: Bruno Volpato
      email: brunocvcunha@gmail.com
    directory: Formula
    homepage: "https://github.com/bvolpato/mermaid-go-renderer"
    description: "Native Mermaid renderer in Go without browser/chromium"
    # The formula has no license field. The repository has no license yet.
    # The owner must set the field to an SPDX expression that is true for the
    # binary: the license of the repository AND the licenses of the code that
    # the binary contains. See docs/LICENSE-AUDIT.md, finding F9.
    test: |
      (testpath/"diagram.mmd").write("flowchart LR\nA --> B\n")
      system "#{bin}/mmdg", "-i", testpath/"diagram.mmd", "-o", testpath/"out.svg", "-e", "svg"
      assert_predicate testpath/"out.svg", :exist?

