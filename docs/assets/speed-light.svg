<svg xmlns="http://www.w3.org/2000/svg" width="880" height="196" viewBox="0 0 880 196" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>mmdg is 13 times faster than mermaid in a warm Chromium page, and 16 times faster than mmdc as a command</title><text x="0" y="18" font-size="11" letter-spacing="0.8" font-weight="600" fill="#6b7c87">ONE RENDER IN A WARM PROCESS</text><text x="0" y="74" font-size="44" font-weight="700" fill="#0b1f2a">13×<tspan font-size="20" font-weight="500" fill="#4b5f6b" dx="8">faster</tspan></text><text x="0" y="123" font-size="13" font-weight="400" fill="#4b5f6b">mermaid in Chromium</text><path d="M150.0 112.0h186.0a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-186.0z" fill="#8796a1"/><text x="348.0" y="123" font-size="13" font-weight="600" fill="#0b1f2a">11.5 ms</text><text x="0" y="159" font-size="13" font-weight="700" fill="#4b5f6b">mmdg</text><path d="M150.0 148.0h10.5a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-10.5z" fill="#0d9488"/><text x="172.5" y="159" font-size="13" font-weight="600" fill="#0b1f2a">0.88 ms</text><path d="M149.5 104v52" stroke="#d7dee3" stroke-width="1"/><text x="460" y="18" font-size="11" letter-spacing="0.8" font-weight="600" fill="#6b7c87">COMMAND-LINE RUN, FLOWCHART TO SVG</text><text x="460" y="74" font-size="44" font-weight="700" fill="#0b1f2a">16×<tspan font-size="20" font-weight="500" fill="#4b5f6b" dx="8">faster</tspan></text><text x="460" y="123" font-size="13" font-weight="400" fill="#4b5f6b">mmdc</text><path d="M610.0 112.0h186.0a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-186.0z" fill="#8796a1"/><text x="808.0" y="123" font-size="13" font-weight="600" fill="#0b1f2a">729 ms</text><text x="460" y="159" font-size="13" font-weight="700" fill="#4b5f6b">mmdg</text><path d="M610.0 148.0h8.2a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-8.2z" fill="#0d9488"/><text x="630.2" y="159" font-size="13" font-weight="600" fill="#0b1f2a">46.8 m