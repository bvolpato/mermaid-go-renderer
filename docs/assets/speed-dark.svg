<svg xmlns="http://www.w3.org/2000/svg" width="880" height="196" viewBox="0 0 880 196" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>mmdg is 14 times faster than mermaid in a warm Chromium page, and 20 times faster than mmdc as a command</title><text x="0" y="18" font-size="11" letter-spacing="0.8" font-weight="600" fill="#8394a0">ONE RENDER IN A WARM PROCESS</text><text x="0" y="74" font-size="44" font-weight="700" fill="#e6edf3">14×<tspan font-size="20" font-weight="500" fill="#9fb0bb" dx="8">faster</tspan></text><text x="0" y="123" font-size="13" font-weight="400" fill="#9fb0bb">mermaid in Chromium</text><path d="M150.0 112.0h186.0a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-186.0z" fill="#5d7a89"/><text x="348.0" y="123" font-size="13" font-weight="600" fill="#e6edf3">13.8 ms</text><text x="0" y="159" font-size="13" font-weight="700" fill="#9fb0bb">mmdg</text><path d="M150.0 148.0h9.8a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-9.8z" fill="#12a594"/><text x="171.8" y="159" font-size="13" font-weight="600" fill="#e6edf3">1.00 ms</text><path d="M149.5 104v52" stroke="#2a3743" stroke-width="1"/><text x="460" y="18" font-size="11" letter-spacing="0.8" font-weight="600" fill="#8394a0">COMMAND-LINE RUN, FLOWCHART TO SVG</text><text x="460" y="74" font-size="44" font-weight="700" fill="#e6edf3">20×<tspan font-size="20" font-weight="500" fill="#9fb0bb" dx="8">faster</tspan></text><text x="460" y="123" font-size="13" font-weight="400" fill="#9fb0bb">mmdc</text><path d="M610.0 112.0h186.0a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-186.0z" fill="#5d7a89"/><text x="808.0" y="123" font-size="13" font-weight="600" fill="#e6edf3">1233 ms</text><text x="460" y="159" font-size="13" font-weight="700" fill="#9fb0bb">mmdg</text><path d="M610.0 148.0h5.4a4.0 4.0 0 0 1 4.0 4.0v6.0a4.0 4.0 0 0 1 -4.0 4.0h-5.4z" fill="#12a594"/><text x="627.4" y="159" font-size="13" font-weight="600" fill="#e6edf3">61.1 ms